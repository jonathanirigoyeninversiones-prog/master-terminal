<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Terminal - Cripto & Quant Growth NYSE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000; /* Fondo Negro Absoluto Institucional */
            color: #eaecef;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            min-height: 100vh;
            padding: 10px;
        }
        header {
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid #2b313a;
            margin-bottom: 12px;
        }
        header h1 {
            font-size: 1.3rem;
            color: #f0b90b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        header p {
            font-size: 0.8rem;
            color: #848e9c;
            margin-top: 4px;
        }
        
        /* Pestañas Principales */
        .main-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background-color: #1e2329;
            padding: 4px;
            border-radius: 8px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #848e9c;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-color: #f0b90b;
            color: #000000;
        }

        /* Sub-Botones / Selectores de Activos */
        .sub-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }
        .sub-nav::-webkit-scrollbar {
            display: none;
        }
        .sub-btn {
            padding: 6px 12px;
            background-color: #1e2329;
            border: 1px solid #2b313a;
            color: #eaecef;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
        }
        .sub-btn.active {
            border-color: #f0b90b;
            color: #f0b90b;
            background-color: rgba(240, 185, 11, 0.1);
        }

        /* Tarjeta Contenedora Principal */
        .card {
            background-color: #181a20;
            border: 1px solid #2b313a;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }
        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-spot { background-color: rgba(14, 203, 129, 0.2); color: #0ecb81; }
        .badge-futures { background-color: rgba(246, 70, 93, 0.2); color: #f6465d; }
        .badge-nyse { background-color: rgba(56, 97, 251, 0.2); color: #3861fb; }

        /* Párrafo Explicativo de Estrategia */
        .strategy-text {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #b7bdc6;
            background-color: #0b0e11;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #f0b90b;
            margin-bottom: 12px;
        }

        /* Formularios e Inputs */
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-group label {
            font-size: 0.75rem;
            color: #848e9c;
        }
        .input-group input, .input-group select {
            background-color: #0b0e11;
            border: 1px solid #2b313a;
            color: #eaecef;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #f0b90b;
        }

        /* Panel de Resultados / Métricas */
        .metrics-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background-color: #0b0e11;
            padding: 10px;
            border-radius: 6px;
        }
        .metric-item {
            display: flex;
            flex-direction: column;
        }
        .metric-label {
            font-size: 0.7rem;
            color: #848e9c;
        }
        .metric-value {
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 2px;
        }
        .val-green { color: #0ecb81; }
        .val-red { color: #f6465d; }
        .val-gold { color: #f0b90b; }

        /* Contenedor del Gráfico TradingView */
        .chart-box {
            height: 450px;
            width: 100%;
            background-color: #0b0e11;
            border-radius: 8px;
            border: 1px solid #2b313a;
            overflow: hidden;
        }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>MASTER TERMINAL DE INVERSIÓN</h1>
            <p>Sistema Cuantitativo de Gestión de Capital y Análisis Bursátil</p>
        </header>

        <div class="main-tabs">
            <button class="tab-btn active" onclick="setMainTab('spot')">Spot</button>
            <button class="tab-btn" onclick="setMainTab('futuros')">Futuros</button>
            <button class="tab-btn" onclick="setMainTab('nyse')">NYSE</button>
        </div>

        <div class="sub-nav" id="sub-nav-container"></div>

        <div class="card">
            <div class="card-header">
                <span class="card-title" id="card-title-text">Cargando...</span>
                <span class="badge" id="card-badge">SPOT</span>
            </div>

            <div class="strategy-text" id="strategy-explanation">
                Cargando estrategia...
            </div>

            <div class="grid-inputs" id="inputs-container"></div>

            <div class="metrics-panel" id="metrics-container"></div>
        </div>

        <div class="chart-box" id="tradingview_widget_container"></div>
    </div>

    <script>
        // ESTADO GLOBAL DE LA APLICACIÓN
        let currentMainTab = 'spot'; // 'spot', 'futuros', 'nyse'
        let currentSymbol = 'BINANCE:BTCUSDT';

        // LISTA DE ACTIVOS POR MERCADO
        const assetsList = {
            spot: [
                { name: 'BTC / USDT', symbol: 'BINANCE:BTCUSDT' },
                { name: 'ETH / USDT', symbol: 'BINANCE:ETHUSDT' },
                { name: 'SOL / USDT', symbol: 'BINANCE:SOLUSDT' },
                { name: 'BNB / USDT', symbol: 'BINANCE:BNBUSDT' }
            ],
            futuros: [
                { name: 'BTC / USDT (Futuros)', symbol: 'BINANCE:BTCUSDT.P' },
                { name: 'ETH / USDT (Futuros)', symbol: 'BINANCE:ETHUSDT.P' },
                { name: 'SOL / USDT (Futuros)', symbol: 'BINANCE:SOLUSDT.P' }
            ],
            nyse: [
                { name: 'SPY (S&P 500 ETF)', symbol: 'AMEX:SPY' },
                { name: 'QQQ (Invesco QQQ)', symbol: 'NASDAQ:QQQ' },
                { name: 'NVDA (NVIDIA)', symbol: 'NASDAQ:NVDA' },
                { name: 'AAPL (Apple)', symbol: 'NASDAQ:AAPL' }
            ]
        };

        // CAMBIO DE PESTAÑA PRINCIPAL
        function setMainTab(tab) {
            currentMainTab = tab;
            
            // Actualizar botones de pestaña
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase() === tab) btn.classList.add('active');
            });

            // Seleccionar primer activo por defecto
            currentSymbol = assetsList[tab][0].symbol;

            renderSubButtons();
            renderView();
        }

        // RENDERIZAR SUB-BOTONES (SELECCIÓN DE ACTIVO)
        function renderSubButtons() {
            const container = document.getElementById('sub-nav-container');
            container.innerHTML = '';

            assetsList[currentMainTab].forEach(asset => {
                const btn = document.createElement('button');
                btn.className = `sub-btn ${asset.symbol === currentSymbol ? 'active' : ''}`;
                btn.innerText = asset.name;
                btn.onclick = () => {
                    currentSymbol = asset.symbol;
                    renderSubButtons();
                    renderView();
                };
                container.appendChild(btn);
            });
        }

        // RENDERIZAR VISTA COMPLETA (TEXTO, CALCULADORA Y GRÁFICO)
        function renderView() {
            const titleElem = document.getElementById('card-title-text');
            const badgeElem = document.getElementById('card-badge');
            const stratElem = document.getElementById('strategy-explanation');
            const inputsElem = document.getElementById('inputs-container');
            const metricsElem = document.getElementById('metrics-container');

            if (currentMainTab === 'spot') {
                titleElem.innerText = `Acumulación Spot - ${currentSymbol.split(':')[1] || currentSymbol}`;
                badgeElem.innerText = "SPOT";
                badgeElem.className = "badge badge-spot";
                stratElem.innerHTML = "<strong>Estrategia Spot:</strong> Diseñada para la acumulación estratégica de activos de alta liquidez sin apalancamiento. En Spot no hace falta configurar Stop Loss ni Take Profit ya que adquirimos el activo real sin riesgo de liquidación. Las compras se ejecutan en zonas de soporte técnico e intervalos clave (1D/4H).";

                inputsElem.innerHTML = `
                    <div class="input-group">
                        <label>Capital Asignado ($ USD):</label>
                        <input type="number" id="inp-capital" value="1000" oninput="calculateSpotMetrics()">
                    </div>
                    <div class="input-group">
                        <label>Precio Compra Spot ($):</label>
                        <input type="number" id="inp-price" value="65000" oninput="calculateSpotMetrics()">
                    </div>
                `;

                metricsElem.innerHTML = `
                    <div class="metric-item">
                        <span class="metric-label">Unidades Adquiridas:</span>
                        <span class="metric-value val-green" id="met-units">0.00</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Riesgo de Liquidación:</span>
                        <span class="metric-value val-green">0% (Ninguno)</span>
                    </div>
                `;
                calculateSpotMetrics();

            } else if (currentMainTab === 'futuros') {
                titleElem.innerText = `Futuros Binance - ${currentSymbol.split(':')[1] || currentSymbol}`;
                badgeElem.innerText = "FUTUROS";
                badgeElem.className = "badge badge-futures";
                
                stratElem.innerHTML = "<strong>Estrategia Futuros (BTC/USDT) con Filtro de Volumen:</strong> Operativa en Margen Aislado con apalancamiento controlado de 3x a 5x. <strong>Uso de Stop Loss (SL) y Take Profit (TP) en ratio mínimo 2:1 obligatorio</strong>. La entrada requiere validación por <strong>Volumen Clímax</strong> (superior a la media de 20 periodos) incrustado en el cálculo cuantitativo.";

                // INSUMOS DE FUTUROS: Incluye selector dinámico de Confirmación de Volumen
                inputsElem.innerHTML = `
                    <div class="input-group">
                        <label>Balance Cuenta ($):</label>
                        <input type="number" id="inp-fut-bal" value="5000" oninput="calculateFuturesMetrics()">
                    </div>
                    <div class="input-group">
                        <label>Riesgo Máximo (%):</label>
                        <input type="number" id="inp-fut-risk" value="1.5" step="0.1" oninput="calculateFuturesMetrics()">
                    </div>
                    <div class="input-group">
                        <label>Precio Entrada ($):</label>
                        <input type="number" id="inp-fut-entry" value="65000" oninput="calculateFuturesMetrics()">
                    </div>
                    <div class="input-group">
                        <label>Stop Loss - SL ($):</label>
                        <input type="number" id="inp-fut-sl" value="64000" oninput="calculateFuturesMetrics()">
                    </div>
                    <div class="input-group">
                        <label>Take Profit - TP ($):</label>
                        <input type="number" id="inp-fut-tp" value="67000" oninput="calculateFuturesMetrics()">
                    </div>
                    <div class="input-group">
                        <label>Volumen Vela vs MA20:</label>
                        <select id="inp-fut-vol" onchange="calculateFuturesMetrics()">
                            <option value="climax">Volumen Clímax (Confirmado)</option>
                            <option value="low">Volumen Bajo / Divergencia</option>
                        </select>
                    </div>
                `;

                // MÉTRICAS DE FUTUROS: Incluye Validación de Volumen incrustada
                metricsElem.innerHTML = `
                    <div class="metric-item">
                        <span class="metric-label">Pérdida Máx (SL):</span>
                        <span class="metric-value val-red" id="met-fut-loss">-$0.00</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Ganancia Est. (TP):</span>
                        <span class="metric-value val-green" id="met-fut-profit">+$0.00</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Ratio Riesgo/Beneficio:</span>
                        <span class="metric-value val-gold" id="met-fut-rr">0.00 : 1</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Validación Cuantitativa de Volumen:</span>
                        <span class="metric-value" id="met-fut-vol-status">Analizando...</span>
                    </div>
                `;
                calculateFuturesMetrics();

            } else if (currentMainTab === 'nyse') {
                titleElem.innerText = `Bolsa de Nueva York - ${currentSymbol}`;
                badgeElem.innerText = "NYSE";
                badgeElem.className = "badge badge-nyse";
                stratElem.innerHTML = "<strong>Estrategia NYSE / Renta Variable:</strong> Análisis macroestructural en temporalidad Diaria (1D) para evaluar bloques de órdenes institucionales y vacuidades de liquidez en las principales acciones y ETFs globales.";

                inputsElem.innerHTML = `
                    <div class="input-group" style="grid-column: span 2;">
                        <label>Mercado NYSE Seleccionado:</label>
                        <input type="text" value="${currentSymbol}" readonly style="color: #f0b90b; font-weight: bold;">
                    </div>
                `;

                metricsElem.innerHTML = `
                    <div class="metric-item" style="grid-column: span 2;">
                        <span class="metric-label">Temporalidad de Análisis:</span>
                        <span class="metric-value val-gold">1D (Diario) / 4H (Intradía)</span>
                    </div>
                `;
            }

            renderTradingViewWidget(currentSymbol);
        }

        // CÁLCULOS SPOT
        function calculateSpotMetrics() {
            const capital = parseFloat(document.getElementById('inp-capital').value) || 0;
            const price = parseFloat(document.getElementById('inp-price').value) || 1;
            const units = capital / price;
            
            const symbolClean = currentSymbol.split(':')[1] ? currentSymbol.split(':')[1].replace('USDT', '') : 'UNID';
            document.getElementById('met-units').innerText = `${units.toFixed(5)} ${symbolClean}`;
        }

        // CÁLCULOS FUTUROS (LÓGICA CON VOLUMEN INCRUSTADO)
        function calculateFuturesMetrics() {
            const balance = parseFloat(document.getElementById('inp-fut-bal').value) || 0;
            const riskPct = parseFloat(document.getElementById('inp-fut-risk').value) || 0;
            const entry = parseFloat(document.getElementById('inp-fut-entry').value) || 1;
            const sl = parseFloat(document.getElementById('inp-fut-sl').value) || 1;
            const tp = parseFloat(document.getElementById('inp-fut-tp').value) || 1;
            const volConfirm = document.getElementById('inp-fut-vol') ? document.getElementById('inp-fut-vol').value : 'climax';

            const maxLoss = balance * (riskPct / 100);
            const distSL = Math.abs(entry - sl);
            const distTP = Math.abs(tp - entry);

            if (distSL > 0) {
                const units = maxLoss / distSL;
                const profit = units * distTP;
                const rr = distTP / distSL;

                document.getElementById('met-fut-loss').innerText = `-$${maxLoss.toFixed(2)}`;
                document.getElementById('met-fut-profit').innerText = `+$${profit.toFixed(2)}`;
                
                const rrElem = document.getElementById('met-fut-rr');
                rrElem.innerText = `${rr.toFixed(2)} : 1`;
                if (rr < 2.0) {
                    rrElem.className = "metric-value val-red";
                } else {
                    rrElem.className = "metric-value val-green";
                }

                // INCRUSTACIÓN DE LA LÓGICA DE VOLUMEN
                const volElem = document.getElementById('met-fut-vol-status');
                if (volElem) {
                    if (volConfirm === 'climax' && rr >= 2.0) {
                        volElem.innerText = "ENTRADA VÁLIDA (Volumen OK)";
                        volElem.className = "metric-value val-green";
                    } else if (volConfirm === 'low') {
                        volElem.innerText = "RIESGO: Falso Rompimiento (Bajo Vol)";
                        volElem.className = "metric-value val-red";
                    } else {
                        volElem.innerText = "REVISAR R/R (Incapaz de Gatillar)";
                        volElem.className = "metric-value val-gold";
                    }
                }
            }
        }

        // RENDERIZAR GRÁFICO TRADINGVIEW
        function renderTradingViewWidget(symbol) {
            document.getElementById('tradingview_widget_container').innerHTML = '';

            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": currentMainTab === 'nyse' ? "D" : "60",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "es",
                "toolbar_bg": "#000000",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "save_image": false,
                "studies": [
                    "Moving Average@tv-basicstudies",
                    "Moving Average Exponential@tv-basicstudies",
                    "RSI@tv-basicstudies",
                    "Volume@tv-basicstudies"
                ],
                "container_id": "tradingview_widget_container",
                "overrides": {
                    "paneProperties.background": "#000000",
                    "paneProperties.vertGridProperties.color": "#121212",
                    "paneProperties.horzGridProperties.color": "#121212"
                }
            });
        }

        // INICIALIZACIÓN DE LA TERMINAL
        renderSubButtons();
        renderView();
    </script>
</body>
</html>
